<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מורה לרוסית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a metro line. Units are stations on one vertical line; the big Cyrillic serif is the voice of the page. */
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --ink:#152130; --muted:#5C6A7A; --rule:#D3D9E0;
  --line:#8E3A8A; --line-ink:#FFFFFF; --line-soft:#F1E3F0;
  --good:#1F7A4D; --good-soft:#DDF1E6; --bad:#B3261E; --bad-soft:#F9E1DF;
  --f-display:"Frank Ruhl Libre","PT Serif","Times New Roman",serif;
  --f-ru:"PT Serif","Times New Roman",Georgia,serif;
  --f-body:"Assistant","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F151D; --surface:#19222E; --ink:#E9EEF4; --muted:#96A3B3; --rule:#2C3745;
    --line:#D08BCB; --line-ink:#1B0F1A; --line-soft:#33203A;
    --good:#6FCF9A; --good-soft:#16372A; --bad:#F2908A; --bad-soft:#44201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F151D; --surface:#19222E; --ink:#E9EEF4; --muted:#96A3B3; --rule:#2C3745;
  --line:#D08BCB; --line-ink:#1B0F1A; --line-soft:#33203A;
  --good:#6FCF9A; --good-soft:#16372A; --bad:#F2908A; --bad-soft:#44201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--line);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 18px}
.ru{font-family:var(--f-ru);direction:ltr;unicode-bidi:isolate}
h1,h2,h3{margin:0;text-wrap:balance}

/* home */
.top{padding:26px 0 18px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand .ru{font-size:44px;font-weight:700;letter-spacing:-.01em;line-height:1}
.brand span.sub{color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.week{display:flex;gap:6px;align-items:center;justify-content:space-between}
.week i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.week i.on{background:var(--line)}
.week i.today{outline:2px solid var(--line);outline-offset:2px}
.cta{background:var(--line);color:var(--line-ink);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:2px;text-align:start;width:100%}
.cta b{font-family:var(--f-display);font-size:24px;font-weight:700}
.cta span{font-size:15px;opacity:.9}
.row2{display:flex;gap:8px}
.ghost{flex:1;border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;text-align:start;display:flex;flex-direction:column}
.ghost b{font-weight:700}
.ghost span{font-size:13px;color:var(--muted)}
.ghost[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted)}

.linehead{font-family:var(--f-display);font-size:20px;font-weight:700;padding:10px 0 4px}
.metro{list-style:none;margin:0;padding:0 0 40px;position:relative}
.metro::before{content:"";position:absolute;inset-block:22px 62px;inset-inline-start:10px;width:6px;border-radius:3px;background:var(--rule)}
.st{position:relative;display:grid;grid-template-columns:26px 1fr;gap:14px;align-items:center;width:100%;text-align:start;padding:11px 0}
.dot{width:26px;height:26px;border-radius:50%;background:var(--paper);border:5px solid var(--rule);position:relative;z-index:1}
.st.cur .dot{border-color:var(--line)}
.st.done .dot{border-color:var(--line);background:var(--line)}
.st .names{display:flex;flex-direction:column;gap:1px;min-width:0}
.st .names .ru{font-size:21px;font-weight:700;text-align:right}
.st .names small{font-size:14px;color:var(--muted)}
.st.lock{opacity:.55}
.bar{height:4px;border-radius:2px;background:var(--rule);margin-top:5px;overflow:hidden;direction:ltr;transform:scaleX(-1)}
.bar u{display:block;height:100%;background:var(--line)}

/* session */
.sbar{display:flex;align-items:center;gap:12px;padding:16px 0 8px}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.prog{flex:1;height:8px;border-radius:4px;background:var(--rule);overflow:hidden;direction:ltr;transform:scaleX(-1)}
.prog u{display:block;height:100%;background:var(--line);transition:width .25s}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:end}
.stage{flex:1;display:flex;flex-direction:column;gap:18px;padding:18px 0 150px}
.tag{font-size:13px;font-weight:700;color:var(--line);letter-spacing:.02em}
.prompt{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.prompt .big{font-size:34px;line-height:1.2;font-weight:700}
.prompt .big.he{font-family:var(--f-display)}
.prompt .big.ru{text-align:left;flex:1}
.hint{color:var(--muted);font-size:16px}
.spk{display:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rule);place-items:center;flex:none}
.can-speak .spk{display:grid}
.spk svg{width:20px;height:20px}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:14px 16px;text-align:start;font-size:19px;min-height:54px}
.opt.ru{font-size:22px;text-align:left}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opts.locked .opt{cursor:default}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--line);text-align:center;color:var(--line)}
.ans{direction:ltr;min-height:62px;border-bottom:2px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;align-content:flex-start}
.bank{direction:ltr;display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-ru);font-size:21px;background:var(--surface);border:1.5px solid var(--rule);border-bottom-width:3px;border-radius:10px;padding:7px 12px}
.tile.used{visibility:hidden}
.card{background:var(--surface);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-size:26px;line-height:1.2}
.card p{margin:0}
.ex{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px}
.ex li{display:flex;flex-direction:column;border-inline-start:4px solid var(--line);padding-inline-start:12px}
.ex .ru{font-size:22px;text-align:right}
.ex small{color:var(--muted);font-size:15px}
.newword{align-items:center;text-align:center;padding:34px 20px}
.newword .ru{font-size:42px;font-weight:700;line-height:1.15}
.newword .he{font-family:var(--f-display);font-size:24px}
.newword .spk{margin-top:4px}
.foot{position:fixed;inset-inline:0;bottom:0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--rule)}
.foot>div{max-width:444px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.foot.ok{background:var(--good-soft);border-color:var(--good)}
.foot.no{background:var(--bad-soft);border-color:var(--bad)}
.fb b{display:block;font-size:18px}
.foot.ok .fb b{color:var(--good)} .foot.no .fb b{color:var(--bad)}
.fb .ru{font-size:21px;display:block;text-align:right}
.fb small{font-size:15px}
.go{background:var(--ink);color:var(--paper);border-radius:14px;padding:15px;font-weight:700;font-size:18px;width:100%}
.go[disabled]{opacity:.35;cursor:default}
.foot.ok .go{background:var(--good);color:var(--surface)} .foot.no .go{background:var(--bad);color:var(--surface)}

/* summary, sprint, unit */
.sum{flex:1;display:flex;flex-direction:column;gap:18px;padding:48px 0 30px}
.sum h1{font-family:var(--f-display);font-size:38px;line-height:1.1}
.sum .ru{font-size:28px;color:var(--line);text-align:right}
.timer{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;flex:1;direction:ltr}
.timer u{display:block;height:100%;background:var(--line)}
.score{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;min-width:38px;text-align:end}
.list{list-style:none;margin:0;padding:0 0 40px}
.list li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.list .ru{font-size:20px}
.list span.he{color:var(--muted);font-size:16px;text-align:start}
.list li.new span.he{opacity:.6}
.pips{font-size:11px;letter-spacing:2px;color:var(--line);direction:ltr;flex:none}

/* dictionary */
.wd{cursor:pointer;text-decoration:underline dotted var(--rule);text-underline-offset:5px;text-decoration-thickness:1.5px}
button .wd{text-decoration:none}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#dict{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
#dict[hidden]{display:none}
.dbg{position:absolute;inset:0;background:rgba(10,16,24,.45)}
.dpanel{position:relative;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;max-height:78%;overflow-y:auto;width:100%;max-width:480px;margin:0 auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.dpanel .dx{position:absolute;top:10px;inset-inline-end:10px;z-index:1}
.dpanel section{display:flex;flex-direction:column;gap:6px}
.dpanel section+section{border-top:1px solid var(--rule);margin-top:14px;padding-top:14px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline-end:40px}
.dh>div{display:flex;flex-direction:column}
.dh .lem{font-size:32px;font-weight:700;line-height:1.15;text-align:right}
.dh .he{font-family:var(--f-display);font-size:21px}
.dh small{color:var(--muted);font-size:14px}
.dpanel h3{font-size:13px;font-weight:700;color:var(--line);margin-top:10px}
.dpanel h4{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.dpanel p{margin:0;font-size:16px}
.dpanel .inv{color:var(--muted)}
.dpanel table{border-collapse:collapse;width:100%}
.dpanel th{font-weight:600;font-size:13px;color:var(--muted);text-align:start;padding:5px 0;white-space:nowrap;padding-inline-end:10px}
.dpanel td{font-size:18px;padding:5px 6px;text-align:left;border-bottom:1px solid var(--rule)}
.dpanel tr:first-child th{border-bottom:1px solid var(--rule)}
.dpanel th.ru{font-family:var(--f-ru);font-size:16px;text-align:left;width:38%}
.dpanel .g4 td{font-size:15px;padding:5px 4px}
.dpanel .wide{overflow-x:auto}
.dpanel .hit{background:var(--line-soft);color:var(--line);font-weight:700;border-radius:5px;padding:0 4px}
.dpanel td[data-c]{cursor:pointer}
.dpanel td.sel{box-shadow:inset 0 -3px 0 var(--line)}
.taphint{color:var(--muted);font-size:13px}
.xp{background:var(--line-soft);border-radius:12px;padding:12px 14px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.xp[hidden]{display:none}
.xh{display:flex;flex-direction:column}
.xh .ru{font-size:24px;font-weight:700;text-align:right}
.xh b{font-size:14px;color:var(--line)}
.xp p{font-size:15px}
.xp p i{font-style:normal;font-weight:700;font-size:12px;color:var(--muted);display:block}
.xp p .ru{font-size:17px}
.dpanel .wd.on{background:var(--line);color:var(--line-ink);border-radius:5px;text-decoration:none;padding:0 3px}
.tr{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin-top:6px}
.tr>div{display:flex;flex-direction:column;min-width:0}
.tr .ru{font-size:19px;font-weight:700;text-align:right}
.tr b{font-family:var(--f-display);font-size:18px;font-weight:500}
.tr small{font-size:12px;color:var(--muted)}
.trb{border:1.5px solid var(--rule);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;white-space:nowrap}
/* lookup */
#fab{position:fixed;top:12px;left:max(12px,calc(50% - 228px));z-index:15;width:44px;height:44px;border-radius:50%;background:var(--line);color:var(--line-ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(10,16,24,.25)}
#fab svg{width:21px;height:21px}
.brand,.sbar{padding-inline-end:52px}
#look{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column}
#look[hidden]{display:none}
.lpanel{position:relative;background:var(--surface);color:var(--ink);border-radius:0 0 20px 20px;width:100%;max-width:480px;margin:0 auto;padding:12px 18px 16px;max-height:70%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;gap:8px;align-items:center}
#lookq{flex:1;min-width:0;font:inherit;font-size:20px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:12px;padding:11px 14px}
#lookq:focus{outline:3px solid var(--line);outline-offset:1px}
.lr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.lr>div{flex:1;min-width:0;display:flex;flex-direction:column}
.lr .ru{font-size:24px;font-weight:700;text-align:right}
.lr .he{font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.prog u{transition:none}}
</style>
</head>

/* ---------- progress model ---------- */
const seen=it=>!!S.items[it.id];
const unitSeen=u=>u.items.filter(seen).length;
const anySeen=()=>Object.keys(S.items).length>0;
const abcOn=()=>S.abc==="on";
const units=()=>abcOn()?UNITS:UNITS.filter(u=>!u.abc);
function curUnit(){for(const u of units())if(unitSeen(u)<u.items.length)return u;return null}
function liveStreak(){const t=dayNum();if(S.last>=t-1)return S.streak;if(S.last===t-2&&S.freeze>0)return S.streak;return 0}
function plan(){
  const t=dayNum();
  const due=shuffle(ALL.filter(i=>seen(i)&&S.items[i.id][1]<=t)).sort((a,b)=>S.items[a.id][1]-S.items[b.id][1]).slice(0,8);
  const cu=curUnit();
  const nNew=due.length>=8?4:due.length>=4?5:7;
  const fresh=cu?cu.items.filter(i=>!seen(i)).slice(0,nNew):[];
  let extra=[];
  const n=due.length+fresh.length;
  if(n<SESSION){const used=new Set(due.map(i=>i.id));
    extra=shuffle(ALL.filter(i=>seen(i)&&!used.has(i.id))).sort((a,b)=>S.items[a.id][0]-S.items[b.id][0]).slice(0,SESSION-n)}
  return {due,fresh,extra,cu};
}

/* ---------- session ---------- */
function startSession(){
  const p=plan();
  const reviews=shuffle(p.due.concat(p.extra)),fresh=p.fresh.slice();
  if(!reviews.length&&!fresh.length)return;
  const q=[];
  if(fresh.length&&p.cu&&!S.rules["u"+p.cu.key])q.push({k:"rule",u:p.cu});
  while(reviews.length||fresh.length){
    const chunk=fresh.splice(0,3);
    chunk.forEach(it=>{if(it.t!=="g")q.push({k:"intro",it})});
    shuffle(chunk.filter(it=>it.t!=="g")).concat(chunk.filter(it=>it.t==="g")).forEach(it=>q.push({k:"q",it}));
    reviews.splice(0,3).forEach(it=>q.push({k:"q",it}));
  }
  ses={q,i:0,total:q.filter(s=>s.k==="q").length,done:0,right:0,miss:0,fresh:p.fresh.length};
  view="session";step();
}
function shell(inner,foot){
  $app.innerHTML='<div class="sbar"><button class="x" data-act="quit" aria-label="סגור">✕</button><div class="prog"><u style="width:'+Math.round(100*ses.done/ses.total)+'%"></u></div><span class="count">'+ses.done+"/"+ses.total+'</span></div>'+
    '<div class="stage">'+inner+'</div><div class="foot" id="foot"><div>'+foot+"</div></div>";
  window.scrollTo(0,0);
}
function kindFor(it){const b=(S.items[it.id]||[0])[0];
  if(it.t==="g")return "gap";
  if(VOCAB.has(it.t))return b%2===0?"ru2he":"he2ru";
  return b%2===0?"tiles":"ru2he"}
function pool(it){let p=ALL.filter(x=>x.t===it.t&&x.u<=it.u);if(p.length<5)p=ALL.filter(x=>x.t===it.t);return p}
function step(){
  const st=ses.q[ses.i];
  if(!st)return finish();
  if(st.k==="rule"){S.rules["u"+st.u.key]=1;saveLocal();
    return shell('<span class="tag">תחנה חדשה · <span class="ru">'+st.u.ru+"</span></span>"+ruleHTML(st.u),'<button class="go" data-act="next">קדימה</button>')}
  if(st.k==="intro"){const it=st.it;
    return shell('<span class="tag">'+({w:"מילה חדשה",l:"אות חדשה",r:"מילה לקריאה"}[it.t]||"משפט חדש")+'</span><div class="card newword"><span class="ru">'+it.ru+'</span><span class="he">'+esc(it.he)+"</span>"+spkBtn(it.ru)+"</div>",
      '<button class="go" data-act="next">הבנתי</button>')}
  const it=st.it,kind=kindFor(it);
  ses.cur={kind,it,st,locked:false};
  if(kind==="ru2he"||kind==="he2ru"){
    const key=kind==="ru2he"?"he":"ru",other=kind==="ru2he"?"ru":"he",ds=[];
    for(const p of shuffle(pool(it))){if(p.id!==it.id&&p[key]!==it[key]&&p[other]!==it[other]&&!ds.some(d=>d[key]===p[key]))ds.push(p);if(ds.length===3)break}
    const opts=shuffle([it].concat(ds));ses.cur.opts=opts;
    const prompt=kind==="ru2he"
      ?'<div class="prompt">'+spkBtn(it.ru)+'<span class="big ru">'+it.ru+"</span></div>"
      :'<div class="prompt"><span class="big he">'+esc(it.he)+"</span></div>";
    return shell('<span class="tag">'+(kind==="ru2he"?({l:"איזה צליל זה?",r:"איך קוראים את זה?"}[it.t]||"מה זה אומר?"):({l:"איזו אות זו?",r:"איזו מילה זו?"}[it.t]||"איך אומרים ברוסית?"))+"</span>"+prompt+
      '<div class="opts" id="opts">'+opts.map((o,i)=>'<button class="opt'+(key==="ru"?" ru":"")+'" data-act="pick" data-i="'+i+'">'+(key==="ru"?o.ru:esc(o.he))+"</button>").join("")+"</div>",
      '<div class="fb" id="fb"></div>');
  }
  if(kind==="gap"){
    const order=shuffle([0,1,2]);ses.cur.order=order;
    return shell('<span class="tag">השלם את המשפט</span><div class="prompt"><span class="big ru" id="gapq">'+it.ru.replace("___",'<span class="gap">&nbsp;</span>')+'</span></div><div class="hint">'+esc(it.he)+"</div>"+
      '<div class="opts" id="opts">'+order.map((o,i)=>'<button class="opt ru" data-act="pick" data-i="'+i+'">'+it.opts[o]+"</button>").join("")+"</div>",
      '<div class="fb" id="fb"></div>');
  }
  // tiles
  const words=it.ru.split(/\s+/).map(w=>w.replace(/[.,!?]/g,"")).filter(Boolean).map(w=>PROPER.has(plain(w))?w:w.toLowerCase());
  const mine=new Set(words.map(plain));
  const others=shuffle(UNITS[it.u].items.filter(x=>x.t==="s"&&x.id!==it.id).flatMap(x=>x.ru.split(/\s+/).map(w=>w.replace(/[.,!?]/g,"")).filter(Boolean).map(w=>PROPER.has(plain(w))?w:w.toLowerCase())))
    .filter((w,i,a)=>!mine.has(plain(w))&&a.findIndex(z=>plain(z)===plain(w))===i).slice(0,2);
  ses.cur.target=words.map(plain).join(" ");
  ses.cur.tiles=shuffle(words.concat(others));ses.cur.pickd=[];
  shell('<span class="tag">בנה את המשפט ברוסית</span><div class="prompt"><span class="big he">'+esc(it.he)+'</span></div><div class="ans" id="ans"></div><div class="bank" id="bank"></div>',
    '<div class="fb" id="fb"></div><button class="go" id="check" data-act="check" disabled>בדוק</button>');
  drawTiles();
}
function drawTiles(){const c=ses.cur;
  document.getElementById("ans").innerHTML=c.pickd.map((ti,i)=>'<button class="tile ru" data-act="untile" data-i="'+i+'">'+c.tiles[ti]+"</button>").join("");
  document.getElementById("bank").innerHTML=c.tiles.map((w,i)=>'<button class="tile ru'+(c.pickd.includes(i)?" used":"")+'" data-act="tile" data-i="'+i+'">'+w+"</button>").join("");
  const b=document.getElementById("check");if(b)b.disabled=!c.pickd.length}
function grade(ok){
  const c=ses.cur,it=c.it,t=dayNum(),rec=(S.items[it.id]||[0,t]).slice();
  c.locked=true;
  if(!c.st.retry){
    if(ok&&c.peek){rec[0]=Math.max(rec[0],1);rec[1]=t+1}
    else if(ok){rec[0]=Math.min(rec[0]+1,6);rec[1]=t+INT[rec[0]];S.xp+=10;ses.right++}
    else{rec[0]=Math.min(rec[0],1);rec[1]=t}
  }else if(ok){rec[1]=Math.max(rec[1],t+1)}
  S.items[it.id]=rec;
  if(ok)ses.done++;else{ses.miss++;ses.q.splice(Math.min(ses.i+4,ses.q.length),0,{k:"q",it,retry:true})}
  saveLocal();
  const foot=document.getElementById("foot"),fb=document.getElementById("fb"),chk=document.getElementById("check");
  if(chk)chk.remove();
  foot.classList.add(ok?"ok":"no");
  const full=it.t==="g"?it.ru.replace("___",it.opts[0]):it.ru;
  if(ok){fb.innerHTML="<b>נכון</b>"+(c.peek?"<small>נעזרת במילון, אז הפריט יחזור מחר.</small>":"")+(it.t==="g"?"<small>"+fmt(it.why)+"</small>":"");
    foot.firstElementChild.insertAdjacentHTML("beforeend",'<button class="go" data-act="next">המשך</button>');
    if(it.t!=="g")c.auto=setTimeout(()=>{if(ses&&ses.cur===c)next()},750)}
  else{fb.innerHTML='<b>התשובה הנכונה</b><span class="ru">'+full+'</span><small>'+(it.t==="g"?fmt(it.why):esc(it.he))+"</small>";
    foot.firstElementChild.insertAdjacentHTML("beforeend",'<button class="go" data-act="next">המשך</button>')}
}
function next(){if(ses.cur&&ses.cur.auto)clearTimeout(ses.cur.auto);ses.cur=null;ses.i++;step()}
function finish(){
  const t=dayNum();let usedFreeze=false;
  if(S.last!==t){
    if(S.last===t-1)S.streak++;
    else if(S.last===t-2&&S.freeze>0){S.freeze--;S.streak++;usedFreeze=true}
    else S.streak=1;
    S.last=t;if(!S.days.includes(t))S.days.push(t);S.days=S.days.slice(-40);
    if(S.streak%7===0&&S.freeze<2)S.freeze++;
  }
  save();view="summary";
  const acc=ses.total?Math.round(100*ses.right/ses.total):100;
  $app.innerHTML='<div class="sum"><span class="ru">Молоде'+ACC+'ц!</span><h1>המפגש של היום הושלם</h1>'+
   '<div class="stats"><div class="stat"><b>'+S.streak+'</b><span>ימים ברצף</span></div><div class="stat"><b>'+acc+'%</b><span>נכון בניסיון ראשון</span></div><div class="stat"><b>'+ses.fresh+'</b><span>פריטים חדשים</span></div></div>'+
   (usedFreeze?'<p class="note">פספסת יום אחד. יום החסד שמר על הרצף.</p>':"")+
   '<p>מה שטעית בו יחזור מחר. מה שידעת יחזור בעוד כמה ימים, בדיוק כשתתחיל לשכוח.</p>'+
   '<button class="go" data-act="home">חזרה למסלול</button><button class="ghost" data-act="start"><b>עוד מפגש</b><span>רק אם יש לך כוח. מפגש אחד ביום מספיק.</span></button></div>';
  ses=null;window.scrollTo(0,0);
}

/* ---------- sprint ---------- */
function startSprint(){
  const words=ALL.filter(i=>VOCAB.has(i.t)&&seen(i));if(words.length<6)return;
  spr={words,score:0,end:Date.now()+60000,cur:null,lock:false};view="sprint";
  $app.innerHTML='<div class="sbar"><button class="x" data-act="home" aria-label="סגור">✕</button><div class="timer"><u id="tm" style="width:100%"></u></div><span class="score" id="sc">0</span></div><div class="stage" id="sq"></div>';
  sprTimer=setInterval(()=>{const left=spr.end-Date.now(),el=document.getElementById("tm");
    if(left<=0){clearInterval(sprTimer);endSprint()}else if(el)el.style.width=(left/600)+"%"},200);
  sprintQ();
}
function sprintQ(){
  const it=spr.words[Math.floor(Math.random()*spr.words.length)];
  if(spr.cur&&spr.cur.it===it&&spr.words.length>1)return sprintQ();
  const ds=[];for(const p of shuffle(ALL.filter(x=>x.t===it.t))){if(p.id!==it.id&&p.he!==it.he&&p.ru!==it.ru&&!ds.some(d=>d.he===p.he))ds.push(p);if(ds.length===3)break}
  const opts=shuffle([it].concat(ds));spr.cur={it,opts};spr.lock=false;
  document.getElementById("sq").innerHTML='<div class="prompt"><span class="big ru">'+it.ru+'</span></div><div class="opts">'+
    opts.map((o,i)=>'<button class="opt" data-act="spick" data-i="'+i+'">'+esc(o.he)+"</button>").join("")+"</div>";
}
function endSprint(){
  const best=spr.score>S.best;if(best){S.best=spr.score;save()}
  view="summary";
  $app.innerHTML='<div class="sum"><span class="ru">Сто'+ACC+'п!</span><h1>'+spr.score+" תשובות נכונות בדקה</h1><p>"+(best?"שיא חדש.":"השיא שלך: "+S.best+".")+'</p><button class="go" data-act="sprint">שוב</button><button class="ghost" data-act="home"><b>חזרה למסלול</b><span></span></button></div>';
  spr=null;
}

const normHe=s=>s.replace(/[֑-ׇ]/g,"").replace(/[״"׳'?!.]/g,"").trim().toLowerCase();
const heKeys=he=>he.replace(/\([^)]*\)/g,"").split(/[,;\/·]/).map(normHe).filter(Boolean);
const POOL=(()=>{const seen=new Set(),out=[];
  const add=(ru,he,lex)=>{const k=plain(ru).toLowerCase()+"|"+he;if(seen.has(k))return;seen.add(k);out.push({ru,he,lex,keys:heKeys(he),rk:plain(ru).toLowerCase()})};
  LEX.forEach(e=>{if(e.pos!=="שם של יחסה")add(R(e.l),e.he,true)});
  ALL.forEach(i=>{if(i.t==="w"||i.t==="s")add(i.ru,i.he,false)});
  EXTRA.forEach(x=>add(R(x[0]),x[1],false));
  return out})();
function lookup(q){
  q=normHe(q);if(!q)return null;
  const cyr=/[а-яё]/i.test(q),res=[];
  const alts=[q];
  if(!cyr){if(/^[הוב]/.test(q)&&q.length>2)alts.push(q.slice(1));if(q.length>1)alts.push("ל"+q)}
  for(const p of POOL){let best=9;
    if(cyr){if(p.rk===q)best=0;else if(p.rk.startsWith(q))best=2;else if(q.length>1&&p.rk.includes(q))best=3}
    else for(const k of p.keys){
      const s=k===q?0:alts.includes(k)?1:k.split(" ").includes(q)?1.5:k.startsWith(q)?2:(q.length>1&&k.includes(q))?3:9;
      if(s<best)best=s}
    if(best<9)res.push([best+(p.lex?0:0.2)+(p.he.includes("(")?0.1:0),p.ru.length,p]);
  }
  res.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  return res.slice(0,8).map(r=>r[2]);
}

$app.addEventListener("click",e=>{

    if(!inBtn||(inBtn.dataset.act==="pick"&&ses&&ses.cur&&ses.cur.locked))return showWord(wd.textContent)}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const act=b.dataset.act,i=+b.dataset.i;
  if(act==="say")return say(b.dataset.say);
  if(act==="home"){clearInterval(sprTimer);return renderHome()}
  if(act==="abc-on"||act==="abc-off"){S.abc=act==="abc-on"?"on":"off";save();return renderHome()}
  if(act==="abc-toggle"){S.abc=abcOn()?"off":"on";save();return renderHome()}

  if(act==="next")return next();

    b.classList.add(ok?"ok":"no");if(ok){spr.score++;document.getElementById("sc").textContent=spr.score}
    else{const k=spr.cur.opts.indexOf(spr.cur.it);b.parentNode.children[k].classList.add("ok")}
    return void setTimeout(()=>{if(spr)sprintQ()},ok?160:650)}
  const c=ses&&ses.cur;if(!c||c.locked)return;
  if(act==="pick"){
    const box=document.getElementById("opts");box.classList.add("locked");
    if(c.kind==="gap"){const ok=c.order[i]===0;b.classList.add(ok?"ok":"no");
      if(!ok)box.children[c.order.indexOf(0)].classList.add("ok");
      document.getElementById("gapq").innerHTML=c.it.ru.replace("___",'<span class="gap">'+c.it.opts[0]+"</span>");

    if(!ok)box.children[c.opts.indexOf(c.it)].classList.add("ok");
    return grade(ok)}
  if(act==="tile"){if(!c.pickd.includes(i)){c.pickd.push(i);drawTiles()}return}
  if(act==="untile"){c.pickd.splice(i,1);return drawTiles()}
  if(act==="check"){const got=c.pickd.map(ti=>plain(c.tiles[ti])).join(" ");return grade(got===c.target)}
});
